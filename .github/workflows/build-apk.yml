name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project (with home screen widget)
        run: bash scripts/prepare-android.sh widget

      - name: Build APK (with widget)
        id: build_widget
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build again without the widget (runs only if the first build failed)
        if: steps.build_widget.outcome == 'failure'
        run: |
          echo "::warning::The build with the widget failed, so the app is built without the widget."
          bash scripts/prepare-android.sh nowidget
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPlanner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
