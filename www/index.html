<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d7a6f">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>My Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone-width column (max 520px, centred on wide screens): header with language + theme buttons, scrolling content, bottom tab bar, floating add button. Quiet teal accent on cool green-grey neutrals. */
:root{
  --outer:#e3eae8; --bg:#f1f5f4; --card:#ffffff; --text:#14201f; --muted:#5d6e6b; --border:#dce5e3;
  --accent:#0d7a6f; --accent-soft:#d8eeea; --on-accent:#ffffff; --break:#c98a12; --break-soft:#f6e9c8;
  --danger:#c43d2c; --danger-soft:#fbe6e2; --scrim:rgba(10,20,19,.5);
  --shadow:0 1px 2px rgba(20,40,38,.06),0 4px 14px rgba(20,40,38,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --outer:#0a1110; --bg:#0f1716; --card:#172220; --text:#e6efed; --muted:#8da19e; --border:#253633;
    --accent:#4fc2b2; --accent-soft:#1b3834; --on-accent:#04211d; --break:#f0b84a; --break-soft:#3a3018;
    --danger:#ff7e6a; --danger-soft:#3a1f1b; --scrim:rgba(0,0,0,.6);
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --outer:#0a1110; --bg:#0f1716; --card:#172220; --text:#e6efed; --muted:#8da19e; --border:#253633;
  --accent:#4fc2b2; --accent-soft:#1b3834; --on-accent:#04211d; --break:#f0b84a; --break-soft:#3a3018;
  --danger:#ff7e6a; --danger-soft:#3a1f1b; --scrim:rgba(0,0,0,.6);
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--outer);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Sans",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
[dir=rtl] .flip{transform:scaleX(-1)}

#app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
header .hl{min-width:0}
header h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em}
header .subline{color:var(--muted);font-size:13px;margin-top:2px}
.hbtns{display:flex;gap:8px}
.pill{height:38px;min-width:38px;padding:0 12px;border-radius:19px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
main{flex:1;min-height:0;overflow-y:auto;padding-block:8px 120px}
.view{display:none}.view.active{display:block}
nav{display:flex;flex-shrink:0;background:var(--card);border-top:1px solid var(--border)}
nav button{flex:1;background:none;border:0;padding:10px 0 9px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.active{color:var(--accent);font-weight:700}
.fab{position:absolute;inset-inline-end:calc(18px + env(safe-area-inset-right,0px));bottom:78px;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(13,122,111,.35);z-index:4}
.fab svg{width:26px;height:26px;stroke-width:2.4}

.card{background:var(--card);border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow)}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.del{background:var(--danger-soft);color:var(--danger)}
.btn.wide{width:100%;margin-top:10px}
.icon-btn{background:none;border:0;padding:8px;color:var(--muted);border-radius:8px;display:inline-flex}
.empty{text-align:center;color:var(--muted);padding:56px 20px}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);margin-top:6px}
textarea{min-height:170px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin-top:14px}

.filters{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--muted)}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}

.tcard{margin-bottom:10px;overflow:hidden}
.trow{display:flex;align-items:center;gap:10px;padding:12px 8px 12px 14px;padding-inline:14px 6px}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:none;padding:0;color:transparent}
.check svg{width:14px;height:14px;stroke-width:3}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check.sm{width:20px;height:20px}
.check.sm svg{width:12px;height:12px}
.body{flex:1;min-width:0;cursor:pointer}
.t{font-size:16px;overflow-wrap:anywhere}
.done>.trow .t,.sub.done .st,.ev.done .evt{text-decoration:line-through;color:var(--muted)}
.d{font-size:12px;color:var(--muted);margin-top:2px}
.d.over{color:var(--danger);font-weight:600}
.chev{transition:transform .15s}
.chev.closed{transform:rotate(-90deg)}
[dir=rtl] .chev.closed{transform:rotate(90deg)}
.pbar{height:3px;background:var(--accent-soft)}
.pbar i{display:block;height:100%;background:var(--accent)}
.subs{border-top:1px solid var(--border);padding:2px 14px 2px}
.sub{display:flex;align-items:center;gap:10px;padding:7px 0 7px 18px;padding-inline:18px 0}
.sub .st{flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere}
.subadd{display:flex;gap:8px;padding:6px 14px 12px}
.subadd input{margin:0;padding:10px 12px}
.subadd .btn{padding:0 14px}

.note{padding:14px;margin-bottom:10px;cursor:pointer}
.note h3{margin:0 0 4px;font-size:16px}
.note p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.note .dt{font-size:11px;color:var(--muted);margin-top:8px}
#noteSearch{margin:0 0 12px}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h2{margin:0;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:10px}
.dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;overflow:hidden;white-space:nowrap}
.day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;background:none;border:2px solid transparent;color:var(--text);padding:0;min-width:0}
.day.out{color:var(--muted);opacity:.45}
.day.today{border-color:var(--accent)}
.day.sel{background:var(--accent);color:var(--on-accent)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1px var(--card)}
#dayLabel{margin:18px 2px 8px;font-size:16px}
.ev{display:flex;gap:12px;padding:12px 14px;margin-bottom:8px;align-items:center}
.ev .bar{width:4px;align-self:stretch;border-radius:4px;flex-shrink:0}
.ev .time{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ev .time svg{width:13px;height:13px}

.modal{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
#m-cf{z-index:30;align-items:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92%;overflow-y:auto}
#m-cf .sheet{border-radius:20px;max-width:340px;margin:0 16px}
.sheet h2{margin:0;font-size:18px}
.row{display:flex;gap:10px;margin-top:18px}
.row .btn{flex:1;padding-inline:8px}
.sedit{display:flex;gap:6px;align-items:center;margin-top:8px}
.sedit input{margin:0}
.colors{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:0 0 0 1px var(--border)}
.colors button.sel{border-color:var(--text)}
.wd{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wd .chip{padding:7px 11px}
.ivrow{display:flex;align-items:center;gap:10px}
.ivrow input{width:90px;margin:0}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:min(90%,420px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:40;text-align:center}

svg.i.solid{fill:currentColor}
@keyframes viewIn{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
.view.enter{animation:viewIn .24s ease-out}
@keyframes sheetIn{from{opacity:.4;transform:translateY(36px)}to{opacity:1;transform:none}}
.modal.open .sheet{animation:sheetIn .26s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
.tcard.pop{animation:pop .38s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.drawer-scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s;z-index:14}
.drawer-scrim.open{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;bottom:0;inset-inline-start:0;width:min(78%,300px);background:var(--card);border-inline-end:1px solid var(--border);z-index:15;transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 18px;display:flex;flex-direction:column;gap:6px;visibility:hidden}
[dir=rtl] .drawer{transform:translateX(102%)}
.drawer.open{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.drawer-head h2{margin:0;font-size:19px}
.drawer-item{display:flex;align-items:center;gap:12px;background:none;border:0;padding:13px 10px;border-radius:12px;font-size:16px;text-align:start;width:100%}
.drawer-item:hover,.drawer-item:active{background:var(--accent-soft)}

.note{display:flex;gap:12px;align-items:flex-start}
.nmain{flex:1;min-width:0}
.nthumb{width:58px;height:58px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--accent-soft)}
.note .dt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:3px}
.nb svg{width:13px;height:13px}
.sheet.notesheet{display:flex;flex-direction:column;overflow:hidden;height:92%;max-height:92%}
.nbody{flex:1;min-height:120px;overflow-y:auto;margin-top:12px;display:block;padding-bottom:8px;width:100%}
.nbody>*{margin-bottom:6px}
.blk-text{display:block;width:100%!important;min-width:100%;max-width:100%;box-sizing:border-box;border:0;background:transparent;padding:6px 2px;margin:0 0 6px;resize:none;min-height:36px;overflow:hidden;line-height:1.6;font-size:16px;border-radius:6px}
.blk-text:focus{outline:none;background:var(--bg)}
.blk{width:100%;box-sizing:border-box;position:relative;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:8px 6px 8px 12px;padding-inline:12px 6px}
.aplay{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.abar{flex:1;height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden}
.abar i{display:block;height:100%;width:0;background:var(--accent)}
.adur{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
.blk-img{padding:0;overflow:hidden;display:block}
.blk-img img{display:block;width:100%;max-height:320px;min-height:110px;object-fit:cover;cursor:zoom-in;background:var(--accent-soft)}
.blk-x{position:absolute;top:6px;inset-inline-end:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;padding:6px}
.tools{display:flex;gap:10px;margin-top:10px}
.tool{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;border:1px solid var(--border);background:var(--bg);font-weight:600}
.tools.busy .tool{opacity:.4;pointer-events:none}
.recbar{display:flex;align-items:center;gap:12px;margin-top:10px;padding:8px 8px 8px 14px;padding-inline:14px 8px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-weight:700}
.recbar span{font-variant-numeric:tabular-nums}
.recbar .btn{margin-inline-start:auto;padding:8px 14px}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:35;display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}

.seg2{display:flex;gap:8px;justify-content:center;margin:6px 0 0}
.seg2 .chip{flex:1;max-width:160px;text-align:center;padding:9px 14px}
.seg2 .chip.active.brk{background:var(--break);border-color:var(--break);color:#241a03}
.ring{position:relative;width:min(70vw,264px);aspect-ratio:1;margin:26px auto 22px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:10}
.rbg{stroke:var(--accent-soft)}
.rbg.brk{stroke:var(--break-soft)}
.rfg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:552.92;transition:stroke-dashoffset .5s linear}
.rfg.brk{stroke:var(--break)}
.rcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.rtime{font-size:clamp(40px,14vw,56px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;direction:ltr}
.rlabel{color:var(--muted);font-size:14px}
.fctl{display:flex;gap:14px;justify-content:center;align-items:center}
.fbtn{border:0;border-radius:16px;height:56px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.fbtn.main{background:var(--accent);color:var(--on-accent);padding:0 28px;min-width:156px;font-size:16px}
.fbtn.main.brk{background:var(--break);color:#241a03}
.fbtn.sec{background:var(--accent-soft);color:var(--accent);width:56px}
.fstats{margin-top:24px;padding:14px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.sdots{display:flex;gap:6px;flex-wrap:wrap}
.sdots i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.fdemo{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}
.wmock{background:#f4f8f7;border:1px solid #dce5e3;border-radius:18px;padding:14px;color:#14201f;margin-top:10px}
.wmock b{color:#0d7a6f;display:block;margin-bottom:6px;font-size:15px}
.wmock div{font-size:14px;padding:2px 0}
.blk-img.draw img{object-fit:contain;background:#fff;max-height:360px;cursor:pointer}
#m-draw{z-index:26;align-items:stretch;justify-content:center}
.dscreen{width:100%;max-width:520px;height:100%;background:var(--card);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.dtop-mid{display:flex;gap:4px}
.dstage{flex:1;min-height:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:10px}
#dCanvas{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.2);touch-action:none;display:block}
.dtools{padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.dtoolrow{display:flex;gap:6px}
.dtool{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-size:11px;min-width:0}
.dtool.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.dtool span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcolors{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;transition:opacity .15s}
.dcolors.off{opacity:.3;pointer-events:none}
.dcolors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:0 0 0 1px var(--border)}
.dcolors button.sel{border-color:var(--text)}
.dsize input{margin:0;padding:0;border:0;background:none;width:100%}
</style>

<div id="app">
  <header class="gut">
    <div class="hl"><h1 id="title"></h1><div class="subline" id="subtitle"></div></div>
    <div class="hbtns">
      <button class="pill" id="btnMenu" aria-label="menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="pill" id="btnTheme"></button>
    </div>
  </header>

  <main class="gut" id="main">
    <section class="view active" id="v-tasks">
      <div class="filters">
        <button class="chip active" data-f="all" data-i18n="all"></button>
        <button class="chip" data-f="open" data-i18n="todo"></button>
        <button class="chip" data-f="done" data-i18n="done"></button>
      </div>
      <div id="taskList"></div>
    </section>

    <section class="view" id="v-notes">
      <input id="noteSearch" data-i18n-ph="searchNotes" autocomplete="off">
      <div id="noteList"></div>
    </section>

    <section class="view" id="v-cal">
      <div class="cal-head">
        <button class="icon-btn" id="prevM"><svg class="i flip" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <h2 id="monthLabel"></h2>
        <button class="icon-btn" id="nextM"><svg class="i flip" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="card grid" id="grid"></div>
      <h3 id="dayLabel"></h3>
      <div id="evList"></div>
    </section>

    <section class="view" id="v-focus">
      <div class="seg2" id="fSeg">
        <button class="chip" data-m="study"><span data-i18n="study"></span></button>
        <button class="chip brk" data-m="break"><span data-i18n="brk"></span></button>
      </div>
      <div class="ring">
        <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="rbg" id="fRingBg" cx="100" cy="100" r="88"/><circle class="rfg" id="fRing" cx="100" cy="100" r="88"/></svg>
        <div class="rcenter"><div class="rtime" id="fTime">25:00</div><div class="rlabel" id="fLabel"></div></div>
      </div>
      <div class="fctl">
        <button class="fbtn sec" id="fReset" aria-label="reset"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg></button>
        <button class="fbtn main" id="fMain"></button>
      </div>
      <div class="card fstats" id="fStats"></div>
      <button class="fdemo" id="fDemo" data-i18n="demoQuick" hidden></button>
    </section>
  </main>

  <div class="drawer-scrim" id="drawerScrim"></div>

  /* ---------- media storage (IndexedDB, falls back to memory) ---------- */
  var memMedia={}, urlCache={}, idbP=null;
  function idb(){
    if(idbP)return idbP;
    idbP=new Promise(function(res,rej){
      try{
        var r=indexedDB.open('planner-media',1);
        r.onupgradeneeded=function(){r.result.createObjectStore('blobs');};
        r.onsuccess=function(){res(r.result);};
        r.onerror=function(){rej(r.error);};
      }catch(e){rej(e);}
    });
    return idbP;
  }
  function mediaPut(id,blob){
    return idb().then(function(d){return new Promise(function(res,rej){
      var tx=d.transaction('blobs','readwrite');tx.objectStore('blobs').put(blob,id);
      tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};
    });}).catch(function(){memMedia[id]=blob;});
  }
  function mediaGet(id){
    if(memMedia[id])return Promise.resolve(memMedia[id]);
    return idb().then(function(d){return new Promise(function(res,rej){
      var q=d.transaction('blobs').objectStore('blobs').get(id);
      q.onsuccess=function(){res(q.result||null);};q.onerror=function(){rej(q.error);};
    });}).catch(function(){return null;});
  }
  function mediaDel(id){
    if(id.slice(-2)!=='.s')mediaDel(id+'.s');
    delete memMedia[id];
    if(urlCache[id]){try{URL.revokeObjectURL(urlCache[id]);}catch(e){}delete urlCache[id];}
    return idb().then(function(d){return new Promise(function(res){
      var tx=d.transaction('blobs','readwrite');tx.objectStore('blobs').delete(id);
      tx.oncomplete=function(){res();};tx.onerror=function(){res();};
    });}).catch(function(){});
  }
  function mediaURL(id){
    if(urlCache[id])return Promise.resolve(urlCache[id]);
    return mediaGet(id).then(function(b){if(!b)return '';var u=URL.createObjectURL(b);urlCache[id]=u;return u;});
  }
  function fillImg(im){mediaURL(im.dataset.mid).then(function(u){if(u)im.src=u;});}
  function fileToImageBlob(file){
    return new Promise(function(res,rej){
      var u=URL.createObjectURL(file), im=new Image();
      im.onload=function(){
        var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,1600/Math.max(w,h));
        var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        URL.revokeObjectURL(u);
        c.toBlob(function(b){b?res(b):rej(new Error('blob'));},'image/jpeg',.82);
      };
      im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'));};
      im.src=u;
    });
  }

  function insertMedia(b,sel){

    if(!blocks[i]||blocks[i].type!=='text'){i=blocks.length-1;sel={i:i,pos:blocks[i].text.length};}
    var cur=blocks[i], pos=Math.min(sel.pos,cur.text.length);

    cur.text=cur.text.slice(0,pos).replace(/\s+$/,'');

    blocks.splice(i+1,0,b,nt);

  function removeBlock(i){
    var b=blocks[i];if(!b||b.type==='text')return;

      fp=p.text.length;

      blocks.splice(i,1);fi=i-1;

    if(!curAudio)return;
    var c=curAudio;curAudio=null;
    try{c.a.pause();}catch(e){}
    if(c.btn&&c.btn.isConnected){setPlayIcon(c.btn,false);var i=c.btn.parentElement.querySelector('.abar i');if(i)i.style.width='0';}
  }
  function togglePlay(btn){
    var id=btn.dataset.play;
    if(curAudio&&curAudio.id===id){
      if(curAudio.a.paused){curAudio.a.play();setPlayIcon(btn,true);}else{curAudio.a.pause();setPlayIcon(btn,false);}
      return;
    }
    stopAudio();
    mediaURL(id).then(function(u){
      if(!u)return;
      var a=new Audio(u), bar=btn.parentElement.querySelector('.abar i'), dur=+btn.dataset.dur||0;
      curAudio={id:id,a:a,btn:btn};
      a.ontimeupdate=function(){var d=(isFinite(a.duration)&&a.duration>0)?a.duration:dur;if(d&&bar)bar.style.width=Math.min(100,a.currentTime/d*100)+'%';};

      if(pr&&pr.catch)pr.catch(function(){stopAudio();});
    });

  function micOK(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);}
  function showRec(on){$('mn-rec').hidden=!on;$('mn-tools').classList.toggle('busy',on);}
  function startRec(){
    if(recState)return;
    if(!micOK()){toast(t('micNone'));return;}
    var sel={i:lastSel.i,pos:lastSel.pos};
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var mime='';
      ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].some(function(m){try{if(MediaRecorder.isTypeSupported(m)){mime=m;return true;}}catch(e){}return false;});
      var rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream), chunks=[];
      var rs={rec:rec,t0:Date.now(),sel:sel,discard:false,timer:null};
      recState=rs;
      rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
      rec.onstop=function(){
        stream.getTracks().forEach(function(tr){tr.stop();});
        clearInterval(rs.timer);recState=null;showRec(false);
        if(rs.discard||!chunks.length)return;
        var dur=Math.max(1,Math.round((Date.now()-rs.t0)/1000));
        var b={id:uid(),type:'audio',blob:uid(),dur:dur};
        sessionAdded.push(b.blob);
        mediaPut(b.blob,new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'})).then(function(){insertMedia(b,rs.sel);});
      };
      rec.start();
      $('mn-recT').textContent='0:00';showRec(true);
      rs.timer=setInterval(function(){$('mn-recT').textContent=fmtDur((Date.now()-rs.t0)/1000);},250);
      buzz('light');
    }).catch(function(){toast(isNative()?t('micDenied'):t('micNone'));});
  }
  function stopRec(discard){
    if(!recState)return;
    recState.discard=!!discard;
    try{recState.rec.stop();}catch(e){clearInterval(recState.timer);recState=null;showRec(false);}
  }
  $('mn-voice').onclick=startRec;
  $('mn-recStop').onclick=function(){stopRec(false);};
  $('mn-photo').onclick=function(){if(recState)return;photoSel={i:lastSel.i,pos:lastSel.pos};$('mn-file').value='';$('mn-file').click();};
  $('mn-file').onchange=function(){
    var files=Array.prototype.slice.call(this.files||[]);if(!files.length)return;
    var sel=photoSel;
    files.reduce(function(chain,f){

          return mediaPut(b.blob,blob).then(function(){var idx=insertMedia(b,sel);sel={i:idx,pos:0};});
        }).catch(function(){toast(t('imgFail'));});
      });
    },Promise.resolve());
  };

  /* ---------- drawing ---------- */
  var DW=1000, DH=1200;
  var DBASE={pen:3,marker:10,hl:24,epix:26,estroke:20};
  var DCOLORS=['#1b1f23','#e0452f','#f08a24','#e8c21a','#2faa6b','#0d7a6f','#3b72c9','#9a4f9e'];
  var DTOOLS=[
    ['pen','<path d="M4 20l1.2-4.5L16.5 4.2a2 2 0 0 1 2.8 0l.5.5a2 2 0 0 1 0 2.8L8.5 18.8z"/>'],
    ['marker','<path d="M6 18l1-4 8-8 3 3-8 8z"/><path d="M4 21h9"/>'],
    ['hl','<path d="M5 15l7-7 5 5-5 5H8z"/><path d="M14 19h6"/>'],
    ['estroke','<path d="M3 16l6-6 7 7-4 4H6z"/><path d="M14 4l6 6"/>'],
    ['epix','<path d="M4 14l8-8 8 8-5 5H9z"/><circle cx="19" cy="20" r="1.4"/>']
  ];
  var D={strokes:[],undo:[],tool:'pen',color:DCOLORS[0],size:4,cur:null,editIdx:-1,sel:null,scale:1,layer:null,snap:null,erased:false,drawing:false};
  var dcv=$('dCanvas'), dctx=dcv.getContext('2d');
  function dUnits(e){var r=dcv.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*DW*10)/10,Math.round((e.clientY-r.top)/r.height*DH*10)/10];}
  function dPaint(ctx,s){
    ctx.save();
    ctx.lineJoin='round';ctx.lineCap=s.t==='hl'?'butt':'round';
    ctx.globalAlpha=s.t==='hl'?.35:1;ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.lineWidth=s.w;
    var p=s.p;
    if(p.length===1){ctx.beginPath();ctx.arc(p[0][0],p[0][1],s.w/2,0,Math.PI*2);ctx.fill();}
    else{
      ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);
      for(var i=1;i<p.length-1;i++){ctx.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);}
      ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);ctx.stroke();
    }

  }
  function dSetup(){
    var stage=$('dStage'), aw=stage.clientWidth-20, ah=stage.clientHeight-20;
    var dw=Math.max(120,Math.min(aw,ah*DW/DH)), dh=dw*DH/DW, dpr=window.devicePixelRatio||1;
    dcv.style.width=dw+'px';dcv.style.height=dh+'px';
    dcv.width=Math.round(dw*dpr);dcv.height=Math.round(dh*dpr);
    D.scale=dcv.width/DW;
    D.layer=document.createElement('canvas');D.layer.width=dcv.width;D.layer.height=dcv.height;
    dRedrawLayer();dPresent();
  }
  function dRedrawLayer(){
    var c=D.layer.getContext('2d');c.setTransform(1,0,0,1,0,0);c.fillStyle='#fff';c.fillRect(0,0,D.layer.width,D.layer.height);
    c.setTransform(D.scale,0,0,D.scale,0,0);D.strokes.forEach(function(x){dPaint(c,x);});
  }
  function dPresent(){
    dctx.setTransform(1,0,0,1,0,0);dctx.drawImage(D.layer,0,0);
    if(D.cur){dctx.setTransform(D.scale,0,0,D.scale,0,0);dPaint(dctx,D.cur);dctx.setTransform(1,0,0,1,0,0);}
  }
  function dPushUndo(){D.undo.push(D.strokes.slice());if(D.undo.length>60)D.undo.shift();}
  function segDist(p,a,b){
    var dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,k=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;
    k=Math.max(0,Math.min(1,k));var x=a[0]+k*dx-p[0],y=a[1]+k*dy-p[1];return Math.sqrt(x*x+y*y);
  }
  function dHit(x,pt,r){
    var rr=r+x.w/2, q=x.p;
    if(q.length===1)return segDist(pt,q[0],q[0])<=rr;
    for(var i=1;i<q.length;i++)if(segDist(pt,q[i-1],q[i])<=rr)return true;
    return false;
  }
  function dEraseAt(pt){
    var r=DBASE.estroke*D.size/4;
    var keep=D.strokes.filter(function(x){return x.t==='epix'||!dHit(x,pt,r);});
    if(keep.length!==D.strokes.length){
      if(!D.erased){D.undo.push(D.snap);D.erased=true;}
      D.strokes=keep;dRedrawLayer();dPresent();
    }
  }
  dcv.addEventListener('pointerdown',function(e){
    if(D.drawing||!e.isPrimary)return;
    e.preventDefault();D.drawing=true;try{dcv.setPointerCapture(e.pointerId);}catch(x){}
    var pt=dUnits(e);
    if(D.tool==='estroke'){D.snap=D.strokes.slice();D.erased=false;dEraseAt(pt);}
    else{D.cur={t:D.tool,c:D.tool==='epix'?'#ffffff':D.color,w:DBASE[D.tool]*D.size/4,p:[pt]};dPresent();}
  });
  dcv.addEventListener('pointermove',function(e){
    if(!D.drawing)return;
    e.preventDefault();
    var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
    if(!evs.length)evs=[e];
    evs.forEach(function(ev){
      var pt=dUnits(ev);
      if(D.tool==='estroke')dEraseAt(pt);
      else if(D.cur){var l=D.cur.p[D.cur.p.length-1];if(Math.abs(pt[0]-l[0])+Math.abs(pt[1]-l[1])>1.2)D.cur.p.push(pt);}
    });
    if(D.cur)dPresent();
  });
  function dEnd(){
    if(!D.drawing)return;
    D.drawing=false;
    if(D.cur){
      dPushUndo();D.strokes.push(D.cur);

    }
  }
  ['pointerup','pointercancel'].forEach(function(n){dcv.addEventListener(n,dEnd);});
  function buildDrawUI(){
    $('dTools').innerHTML=DTOOLS.map(function(x){
      return '<button class="dtool'+(D.tool===x[0]?' active':'')+'" data-tool="'+x[0]+'"><svg class="i" viewBox="0 0 24 24">'+x[1]+'</svg><span>'+esc(t('tool_'+x[0]))+'</span></button>';
    }).join('');
    $('dColors').innerHTML=DCOLORS.map(function(c){return '<button data-c="'+c+'" style="background:'+c+'" class="'+(c===D.color?'sel':'')+'" aria-label="'+c+'"></button>';}).join('');

    $('dSize').value=D.size;
  }
  $('dTools').addEventListener('click',function(e){var b=e.target.closest('[data-tool]');if(!b)return;D.tool=b.dataset.tool;buildDrawUI();});
  $('dColors').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;D.color=b.dataset.c;buildDrawUI();});
  $('dSize').oninput=function(){D.size=+this.value;};
  $('dUndo').onclick=function(){if(!D.undo.length)return;D.strokes=D.undo.pop();dRedrawLayer();dPresent();};
  $('dClear').onclick=function(){if(!D.strokes.length)return;dPushUndo();D.strokes=[];dRedrawLayer();dPresent();};
  $('dCancel').onclick=function(){
    if(D.drawing)dEnd();

  };
  $('dDone').onclick=function(){finishDrawing();};
  window.addEventListener('resize',function(){if($('m-draw').classList.contains('open')&&D.layer)dSetup();});
  $('mn-draw').onclick=function(){if(recState)return;openDrawing(-1,{i:lastSel.i,pos:lastSel.pos});};
  function openDrawing(editIdx,sel){
    D.editIdx=editIdx;D.sel=sel;D.strokes=[];D.undo=[];D.cur=null;D.drawing=false;D.layer=null;
    $('dUndo').setAttribute('aria-label',t('undo'));$('dClear').setAttribute('aria-label',t('clearAll'));
    buildDrawUI();
    var go=function(){$('m-draw').classList.add('open');requestAnimationFrame(function(){dSetup();});};
    if(editIdx>=0){
      mediaGet(blocks[editIdx].blob+'.s').then(function(b){return b?b.text():null;}).then(function(txt){
        var ok=false;
        if(txt){try{D.strokes=JSON.parse(txt).strokes||[];ok=true;}catch(x){}}
        if(!ok){mediaURL(blocks[editIdx].blob).then(function(u){if(u){$('lbImg').src=u;$('lightbox').hidden=false;}});return;}
        go();
      });
    }else go();
  }
  function finishDrawing(){
    if(D.drawing)dEnd();
    var strokes=D.strokes, ei=D.editIdx, sel=D.sel;
    $('m-draw').classList.remove('open');
    if(!strokes.length){if(ei>=0)removeBlock(ei);return;}
    var out=document.createElement('canvas');out.width=DW;out.height=DH;
    var c=out.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,DW,DH);strokes.forEach(function(x){dPaint(c,x);});
    out.toBlob(function(png){
      var id=uid();
      var json=new Blob([JSON.stringify({v:1,strokes:strokes})],{type:'application/json'});

        if(ei>=0&&blocks[ei]){

  }

  /* ---------- calendar + recurrence ---------- */
  function occursOn(ev,s){
    if(s<ev.date)return false;
    var r=ev.repeat||{type:'none'};
    if(r.until&&s>r.until)return false;
    switch(r.type){
      case 'daily':return true;
      case 'weekly':var days=r.days&&r.days.length?r.days:[pd(ev.date).getDay()];return days.indexOf(pd(s).getDay())>-1;
      case 'interval':return diffDays(ev.date,s)%Math.max(1,+r.every||1)===0;
      case 'monthly':return pd(s).getDate()===pd(ev.date).getDate();
      default:return s===ev.date;
    }
  }
  function repeatLabel(ev){
    var r=ev.repeat||{type:'none'};
    if(r.type==='daily')return t('everyDay');
    if(r.type==='interval')return t('everyN')(Math.max(1,+r.every||1));
    if(r.type==='monthly')return t('monthly');
    if(r.type==='weekly'){
      var days=(r.days&&r.days.length?r.days:[pd(ev.date).getDay()]).slice();
      var w=ws();days.sort(function(a,b){return ((a-w+7)%7)-((b-w+7)%7);});
      return days.map(dayName).join(rtl()?'، ':', ');
    }
    return '';
  }
  $('prevM').onclick=function(){cur.setMonth(cur.getMonth()-1);renderCal();};
  $('nextM').onclick=function(){cur.setMonth(cur.getMonth()+1);renderCal();};
  function renderCal(){
    $('monthLabel').textContent=cur.toLocaleDateString(loc(),{month:'long',year:'numeric'});
    var first=new Date(cur.getFullYear(),cur.getMonth(),1), w=ws();
    var start=new Date(first);start.setDate(1-((first.getDay()-w+7)%7));
    var td=todayISO(), h='';
    for(var k=0;k<7;k++)h+='<div class="dow">'+esc(dayName((w+k)%7))+'</div>';
    for(var i=0;i<42;i++){
      var d=new Date(start);d.setDate(start.getDate()+i);
      var s=iso(d);
      var cols=db.events.filter(function(e){return occursOn(e,s);}).slice(0,3).map(function(e){return '<i style="background:'+e.color+'"></i>';}).join('');
      h+='<button class="day'+(d.getMonth()!==cur.getMonth()?' out':'')+(s===td?' today':'')+(s===selDate?' sel':'')+'" data-d="'+s+'">'+d.getDate()+'<span class="dots">'+cols+'</span></button>';
    }
    $('grid').innerHTML=h;
    $('grid').querySelectorAll('.day').forEach(function(b){b.onclick=function(){selDate=b.dataset.d;renderCal();};});
    renderEvents();
  }
  function renderEvents(){
    $('dayLabel').textContent=pd(selDate).toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'});
    var list=db.events.filter(function(e){return occursOn(e,selDate);})
      .sort(function(a,b){return (a.time||'99:99')<(b.time||'99:99')?-1:1;});
    var el=$('evList');
    if(!list.length){el.innerHTML='<div class="empty" style="padding:24px">'+t('noEvents')+'</div>';return;}
    el.innerHTML=list.map(function(e){
      var dn=e.doneDates.indexOf(selDate)>-1, rep=repeatLabel(e);
      return '<div class="card ev'+(dn?' done':'')+'" data-id="'+e.id+'">'+
        '<button class="check sm'+(dn?' on':'')+'" data-a="evdone">'+svg(P.tick)+'</button>'+
        '<div class="bar" style="background:'+e.color+'"></div>'+
        '<div class="body" data-a="evedit"><div class="evt">'+esc(e.title)+'</div>'+
        '<div class="time"><span>'+(e.time?esc(e.time):t('allDay'))+(e.note?' · '+esc(e.note):'')+'</span>'+
        (rep?'<span style="display:inline-flex;align-items:center;gap:4px">'+svg(P.repeat)+esc(rep)+'</span>':'')+
        (e.remind!==''&&e.remind!=null?'<span style="display:inline-flex;align-items:center;gap:4px">'+svg(P.bell)+esc(remindShort(+e.remind))+'</span>':'')+'</div></div></div>';
    }).join('');
  }
  $('evList').addEventListener('click',function(e){

  var palette=['#0d7a6f','#e0613f','#d99a1e','#3b72c9','#9a4f9e','#5c6b7a'];

    var d=$('me-d').value||selDate, type=$('me-rep').value;
    var rep={type:type,days:[],every:1,until:''};
    if(type!=='none')rep.until=$('me-until').value||'';
    if(type==='weekly')rep.days=evDays.length?evDays.slice().sort():[pd(d).getDay()];
    if(type==='interval')rep.every=Math.max(1,Math.min(365,parseInt($('me-iv').value,10)||1));
    var o={title:ti,date:d,time:$('me-time').value,note:$('me-n').value.trim(),color:evColor,repeat:rep,remind:$('me-rem').value};
    if(editEv)Object.assign(editEv,o);else{o.id=uid();o.doneDates=[];db.events.push(o);}
    selDate=d;var p=pd(d);cur=new Date(p.getFullYear(),p.getMonth(),1);

  };

  /* ---------- haptics + celebration ---------- */
  function buzz(kind){
    try{
      var H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;
      if(H){
        var r=kind==='success'?H.notification({type:'SUCCESS'}):H.impact({style:'LIGHT'});
        if(r&&r.catch)r.catch(function(){});
        return;
      }
      if(navigator.vibrate)navigator.vibrate(kind==='success'?[18,50,28]:12);
    }catch(e){}
  }
  function popCard(id){var el=document.querySelector('.tcard[data-id="'+id+'"]');if(el)el.classList.add('pop');}
  var cv=null, cctx=null, parts=[], craf=0;
  function celebrate(x,y){
    try{if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
    if(!cv){cv=document.createElement('canvas');cv.id='confetti';cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50';document.body.appendChild(cv);}
    var dpr=window.devicePixelRatio||1;
    cv.width=Math.round(window.innerWidth*dpr);cv.height=Math.round(window.innerHeight*dpr);
    cctx=cv.getContext('2d');cctx.setTransform(dpr,0,0,dpr,0,0);
    var cols=['#0d7a6f','#4fc2b2','#d99a1e','#e0613f','#3b72c9','#9a4f9e'];
    for(var i=0;i<44;i++){
      var a=Math.random()*Math.PI*2, sp=3+Math.random()*6;
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,r:3+Math.random()*3,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:0,max:55+Math.random()*30});
    }
    if(!craf)craf=requestAnimationFrame(confettiStep);
  }
  function confettiStep(){
    cctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    parts=parts.filter(function(p){return p.life<p.max;});
    parts.forEach(function(p){
      p.life++;p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      cctx.globalAlpha=Math.max(0,1-p.life/p.max);
      cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.rot);cctx.fillStyle=p.c;cctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cctx.restore();
    });
    if(parts.length)craf=requestAnimationFrame(confettiStep);
    else{craf=0;cctx.clearRect(0,0,window.innerWidth,window.innerHeight);}
  }

  /* ---------- menu drawer + settings ---------- */
  function openDrawer(){$('drawer').classList.add('open');$('drawerScrim').classList.add('open');$('drawer').setAttribute('aria-hidden','false');}
  function closeDrawer(){$('drawer').classList.remove('open');$('drawerScrim').classList.remove('open');$('drawer').setAttribute('aria-hidden','true');}
  $('btnMenu').onclick=openDrawer;
  $('drawerScrim').onclick=closeDrawer;
  $('drawerClose').onclick=closeDrawer;
  $('openSettings').onclick=function(){closeDrawer();syncLangChips();renderWidgetMock();$('m-set').classList.add('open');};
  document.querySelectorAll('#m-set [data-lang]').forEach(function(b){b.onclick=function(){st.lang=b.dataset.lang;saveSt();applyLang();};});
  function syncLangChips(){document.querySelectorAll('#m-set [data-lang]').forEach(function(b){b.classList.toggle('active',b.dataset.lang===st.lang);});}
  function renderWidgetMock(){
    $('widgetDemo').hidden=!DEMO;
    if(!DEMO)return;
    var s0=todayISO();
    var evs=db.events.filter(function(e){return occursOn(e,s0)&&e.doneDates.indexOf(s0)<0;}).sort(function(a,b){return (a.time||'99:99')<(b.time||'99:99')?-1:1;}).slice(0,5);
    $('widgetMock').innerHTML='<b>'+esc(pd(s0).toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'}))+'</b>'+
      (evs.length?evs.map(function(e){return '<div>'+(e.time?esc(e.time)+'  ':'• ')+esc(e.title)+'</div>';}).join(''):'<div>'+esc(t('widgetEmpty'))+'</div>');
  }

  /* ---------- home screen widget data (Android app only) ---------- */
  var wT=null;
  function pushWidget(){clearTimeout(wT);wT=setTimeout(doPushWidget,500);}
  function doPushWidget(){
    var W=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.PlannerWidget;
    if(!W)return;
    var days=[], base=todayISO();
    for(var k=0;k<7;k++){
      var s0=addDays(base,k);
      var evs=db.events.filter(function(e){return occursOn(e,s0)&&e.doneDates.indexOf(s0)<0;})
        .sort(function(a,b){return (a.time||'99:99')<(b.time||'99:99')?-1:1;});
      days.push({d:s0,label:pd(s0).toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'}),ev:evs.slice(0,8).map(function(e){return {t:e.time||'',n:e.title};})});
    }
    try{var r=W.update({data:JSON.stringify({empty:t('widgetEmpty'),days:days})});if(r&&r.catch)r.catch(function(){});}catch(e){}
  }

  /* ---------- focus timer: 25 min study, 5 min break ---------- */
  var FKEY='myplanner.focus', STUDY=25*60000, BREAK=5*60000, RING=552.92;
  var fs={mode:'study',running:false,endAt:0,remaining:STUDY,sessions:{}};
  function loadF(){try{var r=localStorage.getItem(FKEY);if(r)Object.assign(fs,JSON.parse(r));}catch(e){}if(!fs.sessions)fs.sessions={};}
  function saveF(){try{localStorage.setItem(FKEY,JSON.stringify(fs));}catch(e){}}
  function fDur(m){return m==='study'?STUDY:BREAK;}
  function fRemain(){return fs.running?Math.max(0,fs.endAt-Date.now()):fs.remaining;}
  function fAdvance(){
    var done=[], now=Date.now();
    while(fs.running&&now>=fs.endAt){
      if(fs.mode==='study'){
        var day=iso(new Date(fs.endAt));fs.sessions[day]=(fs.sessions[day]||0)+1;
        done.push({mode:'study',at:fs.endAt});fs.mode='break';fs.endAt+=BREAK;
      }else{
        done.push({mode:'break',at:fs.endAt});fs.mode='study';fs.running=false;fs.remaining=STUDY;
      }
    }
    return done;
  }
  function beep(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext, c=new AC(), o=c.createOscillator(), g=c.createGain();
      o.frequency.value=880;g.gain.setValueAtTime(.0001,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.7);
      o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.75);
      setTimeout(function(){try{c.close();}catch(e){}},1000);
    }catch(e){}
  }
  function ensureNotifPerm(ask){
    var N=ln();if(!N)return Promise.resolve(false);
    return N.checkPermissions().then(function(p){
      if(p.display==='granted')return true;
      if(!ask||p.display==='denied')return false;
      return N.requestPermissions().then(function(q){return q.display==='granted';});
    }).catch(function(){return false;});
  }
  function cancelFocusNotifs(){var N=ln();if(!N)return Promise.resolve();return Promise.resolve(N.cancel({notifications:[{id:9998},{id:9999}]})).catch(function(){});}
  function scheduleFocusNotifs(){
    var N=ln();if(!N)return;
    ensureNotifPerm(true).then(function(ok){
      if(!ok){toast(t('permDenied'));return;}
      return cancelFocusNotifs().then(function(){
        var list=[{id:9999,channelId:'reminders',title:fs.mode==='study'?t('studyDoneT'):t('breakDoneT'),body:fs.mode==='study'?t('studyDoneB'):t('breakDoneB'),schedule:{at:new Date(fs.endAt),allowWhileIdle:true}}];
        if(fs.mode==='study')list.push({id:9998,channelId:'reminders',title:t('breakDoneT'),body:t('breakDoneB'),schedule:{at:new Date(fs.endAt+BREAK),allowWhileIdle:true}});
        return Promise.resolve(N.createChannel({id:'reminders',name:'Reminders',importance:4,vibration:true,visibility:1})).catch(function(){}).then(function(){return N.schedule({notifications:list});});
      });
    }).catch(function(){});
  }
  function fStart(){
    if(fs.remaining<=0)fs.remaining=fDur(fs.mode);
    fs.running=true;fs.endAt=Date.now()+fs.remaining;saveF();buzz('light');scheduleFocusNotifs();renderFocus();
  }
  function fPause(){fs.remaining=Math.max(0,fs.endAt-Date.now());fs.running=false;saveF();cancelFocusNotifs();renderFocus();}
  function fReset(){fs.running=false;fs.remaining=fDur(fs.mode);saveF();cancelFocusNotifs();renderFocus();}
  function fSetMode(m){if(m===fs.mode)return;fs.mode=m;fs.running=false;fs.remaining=fDur(m);saveF();cancelFocusNotifs();renderFocus();}
  $('fMain').onclick=function(){if(fs.running)fPause();else fStart();};
  $('fReset').onclick=fReset;
  document.querySelectorAll('#fSeg button').forEach(function(b){b.onclick=function(){fSetMode(b.dataset.m);};});
  $('fDemo').onclick=function(){fs.mode='study';fs.running=true;fs.remaining=STUDY;fs.endAt=Date.now()+4000;saveF();renderFocus();};
  function fTick(){
    var f=fAdvance();
    if(f.length){
      saveF();
      var last=f[f.length-1];
      if(Date.now()-last.at<15000){buzz('success');beep();toast(last.mode==='study'?t('studyDoneB'):t('breakDoneB'));}
    }
    renderFocus();
  }
  function renderFocus(){
    if(view!=='focus')return;
    var rem=fRemain(), total=fDur(fs.mode), prog=Math.min(1,Math.max(0,1-rem/total)), sec=Math.ceil(rem/1000), brk=fs.mode==='break';
    $('fTime').textContent=pad(Math.floor(sec/60))+':'+pad(sec%60);
    $('fRing').style.strokeDashoffset=String(RING*(1-prog));
    $('fRing').setAttribute('class','rfg'+(brk?' brk':''));
    $('fRingBg').setAttribute('class','rbg'+(brk?' brk':''));
    $('fLabel').textContent=brk?t('breakLabel'):t('studyLabel');
    document.querySelectorAll('#fSeg button').forEach(function(b){b.classList.toggle('active',b.dataset.m===fs.mode);});
    var label=fs.running?t('pause'):(rem<total?t('resume'):t('start')), key=label+(fs.running?'1':'0')+brk+st.lang, m=$('fMain');
    if(m.dataset.k!==key){m.dataset.k=key;m.className='fbtn main'+(brk?' brk':'');m.innerHTML=svg(fs.running?P.pause:P.play,'solid')+'<span>'+esc(label)+'</span>';}
    var n=fs.sessions[todayISO()]||0, sk=n+'|'+st.lang, sbox=$('fStats');
    if(sbox.dataset.k!==sk){
      sbox.dataset.k=sk;
      var dots='';for(var i=0;i<Math.min(n,10);i++)dots+='<i></i>';
      sbox.innerHTML='<div class="sdots">'+dots+'</div><div>'+esc(t('sessionsToday')(n))+(n?' · '+n*25+' '+esc(t('minShort')):'')+'</div>';
    }
  }

  /* ---------- demo seeds (preview only) ---------- */
  function demoWav(){
    var sr=8000, secs=3, n=sr*secs, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
    function w(o,x){for(var i=0;i<x.length;i++)v.setUint8(o+i,x.charCodeAt(i));}
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    var f=[440,523,659,784,659,523], seg=n/f.length;
    for(var i=0;i<n;i++){var k=Math.floor(i/seg), pos=(i%seg)/seg, env=Math.min(1,pos*20)*(1-pos); v.setInt16(44+i*2,Math.sin(2*Math.PI*f[k]*i/sr)*env*9000,true);}
    return new Blob([buf],{type:'audio/wav'});
  }
  function demoImage(){
    return new Promise(function(res){
      var c=document.createElement('canvas');c.width=720;c.height=420;var x=c.getContext('2d');
      var g=x.createLinearGradient(0,0,720,420);g.addColorStop(0,'#0d7a6f');g.addColorStop(1,'#d99a1e');x.fillStyle=g;x.fillRect(0,0,720,420);
      x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(560,110,48,0,7);x.fill();
      x.fillStyle='rgba(8,50,45,.55)';x.beginPath();x.moveTo(0,420);x.lineTo(180,230);x.lineTo(320,340);x.lineTo(470,200);x.lineTo(720,420);x.closePath();x.fill();
      c.toBlob(function(b){res(b);},'image/jpeg',.85);
    });
  }
  function seedMediaNote(){
    if(!DEMO||st.demoMedia)return;
    var aId=uid(), iId=uid();
    db.notes.push({id:uid(),title:'ملاحظة بالصوت والصورة',updated:Date.now()+1,blocks:[
      {id:uid(),type:'text',text:'فكرة المشروع: ترتيب الأسبوع ومتابعة المهام.'},
      {id:uid(),type:'audio',blob:aId,dur:3},
      {id:uid(),type:'text',text:'بعد التسجيل أضفت صورة من المكان.'},
      {id:uid(),type:'image',blob:iId},
      {id:uid(),type:'text',text:'وهذا الكلام مكتوب تحت الصورة.'}]});
    st.demoMedia=true;save();saveSt();
    mediaPut(aId,demoWav());
    demoImage().then(function(b){return mediaPut(iId,b);}).then(function(){if(view==='notes')renderNotes();});
  }
  function seedFocus(){
    if(!DEMO)return;
    var d=todayISO();
    if(!fs.sessions[d]&&!st.demoFocus){fs.sessions[d]=2;st.demoFocus=true;saveF();saveSt();}
  }

  /* ---------- reminders (local notifications, Android app only) ---------- */
  function ln(){var c=window.Capacitor;return (c&&c.Plugins&&c.Plugins.LocalNotifications)||null;}
  function remindShort(m){var v=t('remS'+m);return v==='remS'+m?m+' min':v;}
  var toastT=null;
  function toast(m){var el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true;},4000);}
  var REM_DAYS=45, REM_MAX=250;
  function upcomingReminders(){
    var out=[], nowMs=Date.now(), base=todayISO();
    db.events.forEach(function(e){
      if(e.remind===''||e.remind==null||isNaN(+e.remind))return;
      var mins=+e.remind;
      for(var k=0;k<=REM_DAYS;k++){
        var s=addDays(base,k);
        if(!occursOn(e,s)||e.doneDates.indexOf(s)>-1)continue;
        var hm=(e.time||'09:00').split(':'), d=pd(s);
        d.setHours(+hm[0],+hm[1],0,0);
        var at=new Date(d.getTime()-mins*60000);
        if(at.getTime()<=nowMs+5000)continue;
        out.push({at:at,e:e,mins:mins});
      }
    });
    out.sort(function(a,b){return a.at-b.at;});
    return out.slice(0,REM_MAX);
  }
  var schedBusy=false, schedAgain=false, schedAsk=false;
  function rescheduleReminders(ask){
    var N=ln();if(!N)return;
    if(ask)schedAsk=true;
    if(schedBusy){schedAgain=true;return;}
    schedBusy=true;var wantAsk=schedAsk;schedAsk=false;
    N.checkPermissions().then(function(p){
      if(p.display==='granted'||!wantAsk||p.display==='denied')return p;
      return N.requestPermissions();
    }).then(function(p){
      return N.getPending().then(function(r){
        var n=(r&&r.notifications?r.notifications:[]).filter(function(x){return x.id<9000;});
        return n.length?N.cancel({notifications:n.map(function(x){return {id:x.id};})}):null;
      }).then(function(){
        if(p.display!=='granted'){if(wantAsk)toast(t('permDenied'));return;}
        var list=upcomingReminders();if(!list.length)return;
        return Promise.resolve(N.createChannel({id:'reminders',name:'Reminders',importance:4,vibration:true,visibility:1})).catch(function(){}).then(function(){
          return N.schedule({notifications:list.map(function(x,i){
            return {id:i+1,channelId:'reminders',title:x.e.title,
              body:(x.e.time||t('allDay'))+(x.mins?' · '+remindShort(x.mins):'')+(x.e.note?' · '+x.e.note:''),
              schedule:{at:x.at,allowWhileIdle:true}};
          })});
        });
      });
    }).catch(function(){}).then(function(){
      schedBusy=false;
      if(schedAgain){schedAgain=false;rescheduleReminders();}
    });
  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden)rescheduleReminders();});

  /* ---------- Android back button (Capacitor) ---------- */
  try{
    var AppPlugin=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
    if(AppPlugin){
      AppPlugin.addListener('appStateChange',function(s){if(s&&s.isActive)rescheduleReminders();});
      AppPlugin.addListener('backButton',function(){
        if(!$('lightbox').hidden){$('lightbox').hidden=true;return;}
        if($('drawer').classList.contains('open')){closeDrawer();return;}
        var open=document.querySelectorAll('.modal.open');
        if(open.length){var m=open[open.length-1];if(m.id==='m-note')saveNote();else if(m.id==='m-draw')finishDrawing();else m.classList.remove('open');}
        else if(view!=='tasks')show('tasks',true);
        else AppPlugin.exitApp();
      });
    }
  }catch(e){}

  /* ---------- start ---------- */
  load();loadF();seed();seedMediaNote();seedFocus();$('fDemo').hidden=!DEMO;applyTheme();applyLang();rescheduleReminders();fTick();setInterval(fTick,500);
})();
</script>
