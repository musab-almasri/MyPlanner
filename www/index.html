<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>My Planner</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#1f2430; --muted:#7a8194; --primary:#4f46e5;
  --primary-soft:#e8e7fd; --danger:#e5484d; --ok:#2faa6b; --border:#e6e8ef; --shadow:0 2px 10px rgba(30,35,60,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12141c; --card:#1c1f2b; --text:#eceef5; --muted:#8c93a8; --primary:#8b83ff; --primary-soft:#2a2850; --border:#2a2e3d; --shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Roboto,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:22px}
header .sub{color:var(--muted);font-size:13px}
main{flex:1;overflow-y:auto;padding:8px 16px 100px}
.view{display:none}.view.active{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:22px}
nav button.active{color:var(--primary);font-weight:600}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.fab{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(79,70,229,.45);z-index:6}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;margin-top:6px}
textarea{min-height:160px;resize:vertical}
label{font-size:13px;color:var(--muted);display:block;margin-top:12px}
.btn{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;background:var(--primary);color:#fff}
.btn.sec{background:var(--primary-soft);color:var(--primary)}
.btn.del{background:#fde8e9;color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
/* Tasks */
.filters{display:flex;gap:8px;margin:6px 0 12px}
.chip{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--muted)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px}
.task .check{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:none;color:#fff;font-size:14px;padding:0}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task .body{flex:1;min-width:0}
.task .t{font-size:16px;word-break:break-word}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .d{font-size:12px;color:var(--muted);margin-top:2px}
.task .d.over{color:var(--danger)}
.icon-btn{background:none;border:0;font-size:18px;padding:6px;color:var(--muted)}
/* Notes */
.search{margin:0 0 12px}
.note{padding:14px;margin-bottom:10px}
.note h3{margin:0 0 4px;font-size:16px}
.note p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.note .dt{font-size:11px;color:var(--muted);margin-top:8px}
/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h2{margin:0;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px}
.dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;background:none;border:0;color:var(--text);position:relative}
.day.out{color:var(--muted);opacity:.4}
.day.today{border:2px solid var(--primary)}
.day.sel{background:var(--primary);color:#fff}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--primary);position:absolute;bottom:5px}
.day.sel .dot{background:#fff}
.ev{display:flex;gap:12px;padding:12px 14px;margin-bottom:8px;align-items:center}
.ev .bar{width:4px;align-self:stretch;border-radius:4px}
.ev .body{flex:1}
.ev .time{font-size:12px;color:var(--muted)}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:90%;overflow-y:auto}
.sheet h2{margin:0 0 4px;font-size:18px}
.row{display:flex;gap:10px;margin-top:16px}
.row .btn{flex:1}
.colors{display:flex;gap:10px;margin-top:8px}
.colors span{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.colors span.sel{border-color:var(--text)}
</style>
</head>
<body>
<header>
  <div><h1 id="title">Tasks</h1><div class="sub" id="subtitle"></div></div>
</header>

<main>
  <!-- TASKS -->
  <section class="view active" id="v-tasks">
    <div class="filters">
      <button class="chip active" data-f="all">All</button>
      <button class="chip" data-f="open">To do</button>
      <button class="chip" data-f="done">Done</button>
    </div>
    <div id="taskList"></div>
  </section>

  <!-- NOTES -->
  <section class="view" id="v-notes">
    <input class="search" id="noteSearch" placeholder="Search notes…">
    <div id="noteList"></div>
  </section>

  <!-- CALENDAR -->
  <section class="view" id="v-cal">
    <div class="cal-head">
      <button class="icon-btn" id="prevM">◀</button>
      <h2 id="monthLabel"></h2>
      <button class="icon-btn" id="nextM">▶</button>
    </div>
    <div class="card grid" id="grid"></div>
    <h3 id="dayLabel" style="margin:18px 4px 8px"></h3>
    <div id="evList"></div>
  </section>
</main>

<button class="fab" id="fab">+</button>

<nav>
  <button class="active" data-v="tasks"><span class="ic">✅</span>Tasks</button>
  <button data-v="notes"><span class="ic">📝</span>Notes</button>
  <button data-v="cal"><span class="ic">📅</span>Calendar</button>
</nav>

<!-- Task modal -->
<div class="modal" id="m-task"><div class="sheet">
  <h2 id="mt-title">New task</h2>
  <label>Task</label><input id="mt-text" placeholder="What needs to be done?">
  <label>Due date (optional)</label><input id="mt-date" type="date">
  <div class="row">
    <button class="btn del" id="mt-del" style="display:none">Delete</button>
    <button class="btn sec" data-close>Cancel</button>
    <button class="btn" id="mt-save">Save</button>
  </div>
</div></div>

<!-- Note modal -->
<div class="modal" id="m-note"><div class="sheet">
  <h2 id="mn-title">New note</h2>
  <label>Title</label><input id="mn-t" placeholder="Title">
  <label>Note</label><textarea id="mn-b" placeholder="Write something…"></textarea>
  <div class="row">
    <button class="btn del" id="mn-del" style="display:none">Delete</button>
    <button class="btn sec" data-close>Cancel</button>
    <button class="btn" id="mn-save">Save</button>
  </div>
</div></div>

<!-- Event modal -->
<div class="modal" id="m-ev"><div class="sheet">
  <h2 id="me-title">New event</h2>
  <label>Title</label><input id="me-t" placeholder="Event title">
  <label>Date</label><input id="me-d" type="date">
  <label>Time (optional)</label><input id="me-time" type="time">
  <label>Details (optional)</label><input id="me-n" placeholder="Location, notes…">
  <label>Colour</label><div class="colors" id="me-colors"></div>
  <div class="row">
    <button class="btn del" id="me-del" style="display:none">Delete</button>
    <button class="btn sec" data-close>Cancel</button>
    <button class="btn" id="me-save">Save</button>
  </div>
</div></div>

<script>
(function(){
  // ---------- Storage ----------
  var KEY='myplanner.v1';
  var db={tasks:[],notes:[],events:[]};
  try{var raw=localStorage.getItem(KEY); if(raw) db=Object.assign(db,JSON.parse(raw));}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function $(id){return document.getElementById(id);}
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
  function pad(n){return n<10?'0'+n:''+n;}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  var todayISO=iso(new Date());

  // ---------- Navigation ----------
  var view='tasks';
  var titles={tasks:'Tasks',notes:'Notes',cal:'Calendar'};
  function show(v){
    view=v;
    document.querySelectorAll('.view').forEach(function(e){e.classList.remove('active');});
    $('v-'+v).classList.add('active');
    document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('active',b.dataset.v===v);});
    $('title').textContent=titles[v];
    $('subtitle').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
    render();
  }
  document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){show(b.dataset.v);};});
  document.querySelectorAll('[data-close]').forEach(function(b){b.onclick=closeModals;});
  document.querySelectorAll('.modal').forEach(function(m){m.onclick=function(e){if(e.target===m)closeModals();};});
  function closeModals(){document.querySelectorAll('.modal').forEach(function(m){m.classList.remove('open');});}
  $('fab').onclick=function(){
    if(view==='tasks')openTask();
    else if(view==='notes')openNote();
    else openEvent(null,selDate);
  };

  // ---------- Tasks ----------
  var filter='all', editTask=null;
  document.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){
    filter=c.dataset.f;
    document.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('active',x===c);});
    renderTasks();
  };});
  function renderTasks(){
    var list=db.tasks.filter(function(t){return filter==='all'||(filter==='done'?t.done:!t.done);});
    list.sort(function(a,b){
      if(a.done!==b.done)return a.done?1:-1;
      if(a.date&&b.date)return a.date<b.date?-1:1;
      if(a.date)return -1; if(b.date)return 1;
      return b.created-a.created;
    });
    var el=$('taskList');
    if(!list.length){el.innerHTML='<div class="empty">Nothing here yet.<br>Tap + to add a task.</div>';return;}
    el.innerHTML=list.map(function(t){
      var over=t.date&&!t.done&&t.date<todayISO;
      return '<div class="card task '+(t.done?'done':'')+'" data-id="'+t.id+'">'+
        '<button class="check" data-act="toggle">'+(t.done?'✓':'')+'</button>'+
        '<div class="body" data-act="edit"><div class="t">'+esc(t.text)+'</div>'+
        (t.date?'<div class="d '+(over?'over':'')+'">'+(over?'Overdue · ':'Due ')+esc(fmtDate(t.date))+'</div>':'')+'</div>'+
        '<button class="icon-btn" data-act="del">🗑</button></div>';
    }).join('');
    el.querySelectorAll('.task').forEach(function(row){
      var id=row.dataset.id;
      row.querySelectorAll('[data-act]').forEach(function(b){b.onclick=function(){
        var act=b.dataset.act, t=db.tasks.find(function(x){return x.id===id;});
        if(act==='toggle'){t.done=!t.done;save();renderTasks();}
        else if(act==='edit')openTask(t);
        else if(act==='del'&&confirm('Delete this task?')){db.tasks=db.tasks.filter(function(x){return x.id!==id;});save();renderTasks();}
      };});
    });
  }
  function openTask(t){
    editTask=t||null;
    $('mt-title').textContent=t?'Edit task':'New task';
    $('mt-text').value=t?t.text:'';
    $('mt-date').value=t&&t.date?t.date:'';
    $('mt-del').style.display=t?'':'none';
    $('m-task').classList.add('open');
    setTimeout(function(){$('mt-text').focus();},100);
  }
  $('mt-save').onclick=function(){
    var text=$('mt-text').value.trim(); if(!text){$('mt-text').focus();return;}
    var date=$('mt-date').value||'';
    if(editTask){editTask.text=text;editTask.date=date;}
    else db.tasks.push({id:uid(),text:text,date:date,done:false,created:Date.now()});
    save();closeModals();renderTasks();
  };
  $('mt-del').onclick=function(){
    if(editTask&&confirm('Delete this task?')){db.tasks=db.tasks.filter(function(x){return x!==editTask;});save();closeModals();renderTasks();}
  };

  // ---------- Notes ----------
  var editNote=null;
  $('noteSearch').oninput=renderNotes;
  function renderNotes(){
    var q=$('noteSearch').value.trim().toLowerCase();
    var list=db.notes.filter(function(n){return !q||(n.title+' '+n.body).toLowerCase().indexOf(q)>-1;})
      .sort(function(a,b){return b.updated-a.updated;});
    var el=$('noteList');
    if(!list.length){el.innerHTML='<div class="empty">No notes yet.<br>Tap + to write one.</div>';return;}
    el.innerHTML=list.map(function(n){
      return '<div class="card note" data-id="'+n.id+'"><h3>'+esc(n.title||'Untitled')+'</h3><p>'+esc(n.body)+'</p>'+
        '<div class="dt">'+esc(new Date(n.updated).toLocaleString())+'</div></div>';
    }).join('');
    el.querySelectorAll('.note').forEach(function(c){c.onclick=function(){
      openNote(db.notes.find(function(x){return x.id===c.dataset.id;}));
    };});
  }
  function openNote(n){
    editNote=n||null;
    $('mn-title').textContent=n?'Edit note':'New note';
    $('mn-t').value=n?n.title:'';
    $('mn-b').value=n?n.body:'';
    $('mn-del').style.display=n?'':'none';
    $('m-note').classList.add('open');
  }
  $('mn-save').onclick=function(){
    var t=$('mn-t').value.trim(), b=$('mn-b').value;
    if(!t&&!b.trim()){closeModals();return;}
    if(editNote){editNote.title=t;editNote.body=b;editNote.updated=Date.now();}
    else db.notes.push({id:uid(),title:t,body:b,updated:Date.now()});
    save();closeModals();renderNotes();
  };
  $('mn-del').onclick=function(){
    if(editNote&&confirm('Delete this note?')){db.notes=db.notes.filter(function(x){return x!==editNote;});save();closeModals();renderNotes();}
  };

  // ---------- Calendar ----------
  var cur=new Date(); cur.setDate(1);
  var selDate=todayISO, editEv=null, evColor='#4f46e5';
  var palette=['#4f46e5','#e5484d','#2faa6b','#f5a524','#0ea5e9','#d946ef'];
  function fmtDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
  $('prevM').onclick=function(){cur.setMonth(cur.getMonth()-1);renderCal();};
  $('nextM').onclick=function(){cur.setMonth(cur.getMonth()+1);renderCal();};
  function renderCal(){
    $('monthLabel').textContent=cur.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    var first=new Date(cur.getFullYear(),cur.getMonth(),1);
    var start=new Date(first); start.setDate(1-((first.getDay()+6)%7)); // Monday first
    var names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    var h=names.map(function(n){return '<div class="dow">'+n+'</div>';}).join('');
    for(var i=0;i<42;i++){
      var d=new Date(start); d.setDate(start.getDate()+i);
      var s=iso(d), has=db.events.some(function(e){return e.date===s;});
      var cls='day'+(d.getMonth()!==cur.getMonth()?' out':'')+(s===todayISO?' today':'')+(s===selDate?' sel':'');
      h+='<button class="'+cls+'" data-d="'+s+'">'+d.getDate()+(has?'<span class="dot"></span>':'')+'</button>';
    }
    $('grid').innerHTML=h;
    $('grid').querySelectorAll('.day').forEach(function(b){b.onclick=function(){selDate=b.dataset.d;renderCal();};});
    renderEvents();
  }
  function renderEvents(){
    $('dayLabel').textContent=fmtDate(selDate);
    var list=db.events.filter(function(e){return e.date===selDate;})
      .sort(function(a,b){return (a.time||'99')<(b.time||'99')?-1:1;});
    var el=$('evList');
    if(!list.length){el.innerHTML='<div class="empty" style="padding:20px">No events this day.<br>Tap + to add one.</div>';return;}
    el.innerHTML=list.map(function(e){
      return '<div class="card ev" data-id="'+e.id+'"><div class="bar" style="background:'+e.color+'"></div>'+
        '<div class="body"><div>'+esc(e.title)+'</div><div class="time">'+(e.time?esc(e.time):'All day')+(e.note?' · '+esc(e.note):'')+'</div></div></div>';
    }).join('');
    el.querySelectorAll('.ev').forEach(function(c){c.onclick=function(){
      openEvent(db.events.find(function(x){return x.id===c.dataset.id;}));
    };});
  }
  function buildColors(){
    $('me-colors').innerHTML=palette.map(function(c){return '<span data-c="'+c+'" style="background:'+c+'" class="'+(c===evColor?'sel':'')+'"></span>';}).join('');
    $('me-colors').querySelectorAll('span').forEach(function(s){s.onclick=function(){evColor=s.dataset.c;buildColors();};});
  }
  function openEvent(e,date){
    editEv=e||null;
    $('me-title').textContent=e?'Edit event':'New event';
    $('me-t').value=e?e.title:'';
    $('me-d').value=e?e.date:(date||selDate);
    $('me-time').value=e&&e.time?e.time:'';
    $('me-n').value=e&&e.note?e.note:'';
    evColor=e?e.color:palette[0]; buildColors();
    $('me-del').style.display=e?'':'none';
    $('m-ev').classList.add('open');
  }
  $('me-save').onclick=function(){
    var t=$('me-t').value.trim(); if(!t){$('me-t').focus();return;}
    var d=$('me-d').value||selDate;
    var o={title:t,date:d,time:$('me-time').value,note:$('me-n').value.trim(),color:evColor};
    if(editEv)Object.assign(editEv,o); else{o.id=uid();db.events.push(o);}
    selDate=d; var p=d.split('-'); cur=new Date(+p[0],+p[1]-1,1);
    save();closeModals();renderCal();
  };
  $('me-del').onclick=function(){
    if(editEv&&confirm('Delete this event?')){db.events=db.events.filter(function(x){return x!==editEv;});save();closeModals();renderCal();}
  };

  // ---------- Render ----------
  function render(){
    if(view==='tasks')renderTasks();
    else if(view==='notes')renderNotes();
    else renderCal();
  }

  // Android back button closes open sheets
  try{
    var AppPlugin=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
    if(AppPlugin){
      AppPlugin.addListener('backButton',function(){
        if(document.querySelector('.modal.open'))closeModals();
        else if(view!=='tasks')show('tasks');
        else AppPlugin.exitApp();
      });
    }
  }catch(e){}

  show('tasks');
})();
</script>
</body>
</html>
